# INTENTIONAL FAILURE (Category 1): reads a secret that is never configured and fails explicitly.
# Do not create ERROR_GENERATOR_MISSING_SECRET in the repository settings.
name: 'Error generator: missing required secret'

on:
  workflow_dispatch:
  push:
    branches: ['ci-error/missing-secret']

permissions:
  contents: read

jobs:
  secret:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a secret that is not configured
        env:
          REQUIRED_SECRET: ${{ secrets.ERROR_GENERATOR_MISSING_SECRET }}
        run: |
          if [ -z "$REQUIRED_SECRET" ]; then
            echo "::error title=Missing secret::ERROR_GENERATOR_MISSING_SECRET is not configured for this repository"
            exit 1
          fi
          echo "Secret is present; this branch of the script is not expected to run"
